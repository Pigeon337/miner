<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Żulcoin Web Miner</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #e0e0e0; 
            padding: 30px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #ff9800; font-size: 28px; margin-bottom: 25px; }
        input { 
            padding: 12px; 
            font-size: 16px; 
            width: 80%; 
            margin-bottom: 15px; 
            background: #2d2d2d; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 6px;
        }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            background: #ff9800; 
            color: #000; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            border-radius: 6px;
            transition: 0.2s;
        }
        button:hover { background: #e08600; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        #stats { 
            font-size: 18px; 
            margin-top: 25px; 
            color: #00ffcc; 
            font-family: monospace;
            background: #151515;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⛏️ Żulcoin Web Miner ⛏️</h1>
        <input type="text" id="username" placeholder="Wpisz swój nick...">
        <br>
        <button id="startBtn" onclick="startMining()">Rozpocznij kopanie</button>
        
        <div id="stats">Status: Oczekiwanie na uruchomienie...</div>
    </div>

    <script>
        // --- TUTAJ WKLEJ SWÓJ URL Z GOOGLE APPS SCRIPT ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAtip-DFf61M8KH0p_AR7e7pGlPipqxNO1-3Ns2fbXwh36lu06vzpW89CTue_NI6DJ/exec";

        let mining = false;
        let hashesCount = 0;
        let userNick = "";

        function startMining() {
            userNick = document.getElementById('username').value.trim();
            if(!userNick) return alert("Musisz wpisać swój nick!");
            
            mining = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('username').disabled = true;
            
            mineLoop();
            
            // Zapis do Arkusza Google co 15 sekund
            setInterval(saveProgress, 15000);
        }

        function mineLoop() {
            if(!mining) return;
            
            crypto.subtle.digest("SHA-256", new TextEncoder().encode(Math.random().toString()));
            hashesCount++;
            
            document.getElementById('stats').innerHTML = `
                Kopiesz jako: <strong>${userNick}</strong><br>
                Obliczone hashe: ${hashesCount}
            `;
            
            setTimeout(mineLoop, 1);
        }

        async function saveProgress() {
            if(!mining) return;

            // 1 moneta za każde 2000 hashy
            const reward = Math.floor(hashesCount / 2000);
            if (reward === 0) return;
            
            hashesCount = 0; 

            // Wysyłamy dane metodą POST do Arkusza Google
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // Ignoruje błędy CORS w przeglądarce, Google i tak to zapisze
                cache: "no-cache",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: userNick,
                    reward: reward
                })
            })
            .then(() => {
                console.log(`Paczka danych wysłana do Arkusza dla: ${userNick}`);
            })
            .catch(err => {
                console.error("Błąd wysyłania do Arkusza:", err);
            });
        }
    </script>
</body>
</html>
