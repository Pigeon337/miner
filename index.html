<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulcoin Web Miner</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #e0e0e0; 
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
        }
        h1 { color: #ff9800; }
        input { 
            padding: 12px; 
            font-size: 16px; 
            width: 80%; 
            margin-bottom: 15px; 
            background: #2d2d2d; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 6px;
        }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            background: #ff9800; 
            color: #000; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            border-radius: 6px;
        }
        #stats { 
            font-size: 18px; 
            margin-top: 25px; 
            color: #00ffcc; 
            font-family: monospace;
            background: #151515;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⛏️ Zulcoin Web Miner ⛏️</h1>
        <input type="text" id="username" placeholder="Wpisz swoj nick...">
        <br>
        <button id="startBtn" onclick="startMining()">Rozpocznij kopanie</button>
        
        <div id="stats">Status: Oczekiwanie...</div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAtip-DFf61M8KH0p_AR7e7pGlPipqxNO1-3Ns2fbXwh36lu06vzpW89CTue_NI6DJ/exec";

        let mining = false;
        let hashesCount = 0;
        let userNick = "";

        function startMining() {
            userNick = document.getElementById("username").value.trim();
            if(!userNick) {
                alert("Wpisz nick!");
                return;
            }
            
            mining = true;
            document.getElementById("startBtn").disabled = true;
            document.getElementById("username").disabled = true;
            
            mineLoop();
            setInterval(saveProgress, 15000);
        }

        function mineLoop() {
            if(!mining) return;
            
            crypto.subtle.digest("SHA-256", new TextEncoder().encode(Math.random().toString()));
            hashesCount++;
            
            document.getElementById("stats").innerHTML = "Kopiesz jako: <strong>" + userNick + "</strong><br>Hashe: " + hashesCount;
            
            setTimeout(mineLoop, 1);
        }

        function saveProgress() {
            if(!mining) return;

            const reward = Math.floor(hashesCount / 2000);
            if (reward === 0) return;
            
            hashesCount = 0; 

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                cache: "no-cache",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: userNick,
                    reward: reward
                })
            })
            .then(function() {
                console.log("Wyslano paczke");
            })
            .catch(function(err) {
                console.error("Blad:", err);
            });
        }
    </script>
</body>
</html>
