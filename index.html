<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Żulcoin Web Miner</title>
    <!-- Zmieniony link do Supabase (serwery UNPKG - ominięcie błędu połączenia) -->
    <script src="https://unpkg.com/@supabase/supabase-js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #e0e0e0; 
            padding: 30px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #ff9800; font-size: 28px; margin-bottom: 25px; }
        input { 
            padding: 12px; 
            font-size: 16px; 
            width: 80%; 
            margin-bottom: 15px; 
            background: #2d2d2d; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 6px;
        }
        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            background: #ff9800; 
            color: #000; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            border-radius: 6px;
            transition: 0.2s;
        }
        button:hover { background: #e08600; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        #stats { 
            font-size: 18px; 
            margin-top: 25px; 
            color: #00ffcc; 
            font-family: monospace;
            background: #151515;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⛏️ Żulcoin Web Miner ⛏️</h1>
        <input type="text" id="username" placeholder="Wpisz swój nick...">
        <br>
        <button id="startBtn" onclick="startMining()">Rozpocznij kopanie</button>
        
        <div id="stats">Status: Oczekiwanie na uruchomienie...</div>
    </div>

    <script>
        // --- TWOJA KONFIGURACJA SUPABASE ---
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrdGZoaGtraWlxYmdlb3JyYmlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxODAsImV4cCI6MjEwODM0NDE4MH0.L7QGv1yUMsgQ6zU-MIqqlA7_ycpjWO4vZBiDlhfo2eM";
        
        // Zabezpieczenie na wypadek, gdyby biblioteka ładowała się ułamek sekundy dłużej
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        let mining = false;
        let hashesCount = 0;
        let userNick = ""; // Zmieniono nazwę, żeby nie gryzła się z ID elementu HTML

        async function startMining() {
            if (!supabaseClient) {
                return alert("Błąd: Nie udało się załadować biblioteki Supabase. Sprawdź połączenie z internetem lub odśwież stronę.");
            }

            userNick = document.getElementById('username').value.trim();
            if(!userNick) return alert("Musisz wpisać swój nick!");
            
            mining = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('username').disabled = true;
            
            mineLoop();
            
            // Wysyłanie danych co 10 sekund
            setInterval(saveProgress, 10000);
        }

        function mineLoop() {
            if(!mining) return;
            
            crypto.subtle.digest("SHA-256", new TextEncoder().encode(Math.random().toString()));
            hashesCount++;
            
            document.getElementById('stats').innerHTML = `
                Kopiesz jako: <strong>${userNick}</strong><br>
                Obliczone hashe: ${hashesCount}
            `;
            
            setTimeout(mineLoop, 1);
        }

        async function saveProgress() {
            if(!mining) return;

            // 1 moneta za każde 2000 hashy
            const reward = Math.floor(hashesCount / 2000);
            if (reward === 0) return;
            
            hashesCount = 0; 

            try {
                // Szukamy gracza w bazie danych
                let { data: user, error: selectError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', userNick)
                    .maybeSingle();

                if (selectError) throw selectError;

                if (!user) {
                    // Jeśli gracz jest nowy -> dodaj go
                    let { error: insertError } = await supabaseClient.from('users').insert([{ username: userNick, balance: reward }]);
                    if (insertError) throw insertError;
                } else {
                    // Jeśli gracz już istnieje -> zaktualizuj jego stan konta
                    let { error: updateError } = await supabaseClient.from('users').update({ balance: user.balance + reward }).eq('username', userNick);
                    if (updateError) throw updateError;
                }
                
                console.log(`Zapisano! Dodano +${reward} Żulcoinów dla konta: ${userNick}`);
            } catch (err) {
                console.error("Błąd bazy danych:", err);
                alert("Błąd zapisu do bazy: " + err.message);
            }
        }
    </script>
</body>
</html>
